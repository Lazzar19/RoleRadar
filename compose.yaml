# Local stack for the discovery process.
# Run one app service. A second copy fetches the same boards twice.
# POSTGRES_PASSWORD below is a development fallback so `docker compose up` works
# without a secret file. Set it in an untracked .env before any shared use.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://scout:${POSTGRES_PASSWORD:-scout}@postgres:5432/scout?sslmode=disable
      PORT: "8080"
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      MAILBOX_URL: ${MAILBOX_URL:-}
      TASK_TIMEOUT: 10m
      SOURCES: |
        [
          {"name":"datadog","type":"greenhouse","board_token":"datadog","enabled":true},
          {"name":"databricks","type":"greenhouse","board_token":"databricks","enabled":true},
          {"name":"cloudflare","type":"greenhouse","board_token":"cloudflare","enabled":true},
          {"name":"elastic","type":"greenhouse","board_token":"elastic","enabled":true},
          {"name":"mongodb","type":"greenhouse","board_token":"mongodb","enabled":true},
          {"name":"gitlab","type":"greenhouse","board_token":"gitlab","enabled":true},
          {"name":"grafanalabs","type":"greenhouse","board_token":"grafanalabs","enabled":true},
          {"name":"cockroachlabs","type":"greenhouse","board_token":"cockroachlabs","enabled":true},
          {"name":"canonical","type":"greenhouse","board_token":"canonical","enabled":true},
          {"name":"tenstorrent","type":"greenhouse","board_token":"tenstorrent","enabled":true},
          {"name":"janestreet","type":"greenhouse","board_token":"janestreet","enabled":true},
          {"name":"jetbrains","type":"greenhouse","board_token":"jetbrains","enabled":true},
          {"name":"nordeus","type":"greenhouse","board_token":"nordeus","enabled":true},
          {"name":"palantir","type":"lever","site":"palantir","enabled":true},
          {"name":"perplexity","type":"ashby","site":"perplexity","enabled":true},
          {"name":"snowflake","type":"ashby","site":"snowflake","enabled":true},
          {"name":"endava","type":"smartrecruiters","site":"Endava","enabled":true},
          {"name":"wise","type":"smartrecruiters","site":"Wise","enabled":true},
          {"name":"linkedin-alerts","type":"email","secret_env":"MAILBOX_URL","enabled":true}
        ]
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EXTRACT_MIN_CHARS: ${EXTRACT_MIN_CHARS:-}
      EXTRACT_MAX_CHARS: ${EXTRACT_MAX_CHARS:-}
      EXTRACT_DAILY_TOKENS: ${EXTRACT_DAILY_TOKENS:-}
      NOTIFY_PREVIEW: ${NOTIFY_PREVIEW:-}
      NOTIFY_EVALUATED: ${NOTIFY_EVALUATED:-}
      GREENHOUSE_INTERVAL: ${GREENHOUSE_INTERVAL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout}
      POSTGRES_DB: scout
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always

  backup:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-scout}
      PGHOST: postgres
      PGUSER: scout
      PGDATABASE: scout
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    restart: always

volumes:
  postgres-data:
  backups:
